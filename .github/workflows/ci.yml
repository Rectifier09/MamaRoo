name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx supabase start
      - run: npx supabase migration up
      - run: npx supabase gen types typescript --local > /tmp/types.ts && diff /tmp/types.ts lib/supabase/database.types.ts
      - name: Export local Supabase credentials for the RLS suite
        run: |
          npx supabase status -o env > /tmp/supabase-status.env
          echo "SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase-status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase-status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase-status.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
