name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx supabase start
      - run: npx supabase migration up
      - run: npx supabase gen types typescript --local | node scripts/gen-db-types.mjs > /tmp/types.ts && diff /tmp/types.ts lib/supabase/database.types.ts
      - name: Seed placeholder content (RLS and retrieval tests need rows to read)
        run: npx supabase db query --local --file supabase/seed/content.placeholder.sql
      - name: Export local Supabase credentials for the RLS suite
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          node scripts/export-supabase-status.mjs /tmp/supabase-status.json >> "$GITHUB_ENV"
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - name: Run e2e against the full app (the launch gate is a production-only concern)
        run: npm run test:e2e
        env:
          APP_LAUNCHED: "true"
