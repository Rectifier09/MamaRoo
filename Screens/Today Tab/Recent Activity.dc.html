<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F7EEE3;}
</style>
</helmet>

<div style="position:relative;width:375px;min-height:812px;margin:0 auto;background:#F7EEE3;font-family:'Roboto',sans-serif;box-sizing:border-box;padding:20px 20px 40px 20px;display:flex;flex-direction:column;gap:18px;">

  <div style="display:flex;flex-direction:column;gap:14px;padding:8px 0 12px 0;border-bottom:1px solid rgba(103,0,53,0.08);">
    <div style="display:flex;align-items:center;gap:12px;">
      <button aria-label="Back to Today" style="width:36px;height:36px;flex-shrink:0;border:none;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 8px rgba(103,0,53,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#670035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h1 style="margin:0;font-family:'Poppins',sans-serif;font-weight:600;font-size:19px;color:#670035;">What you've logged</h1>
    </div>
  </div>

  <sc-if value="{{ hasActivity }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:20px;">
      <sc-for list="{{ groups }}" as="group" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:10px;">
          <p style="margin:0;font-size:12px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:rgba(103,0,53,0.45);">{{ group.label }}</p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <sc-for list="{{ group.entries }}" as="entry" hint-placeholder-count="2">
              <div style="display:flex;gap:14px;">
                <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
                  <div style="{{ entry.iconWrapStyle }}">
                    <sc-if value="{{ entry.isMoodGood }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isMoodNew }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="15" x2="16" y2="15"></line><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isMoodWorried }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 16s-1.5-2-4-2-4 2-4 2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isMedicine }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="5"></rect><line x1="7" y1="12" x2="17" y2="12"></line></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isWellness }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l-3 7h5l-3 7"></path><circle cx="12" cy="4" r="1.6" fill="{{ entry.iconColor }}" stroke="none"></circle></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isMilestone }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"></path></svg>
                    </sc-if>
                    <sc-if value="{{ entry.isAppointment }}" hint-placeholder-val="{{ false }}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ entry.iconColor }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </sc-if>
                  </div>
                  <sc-if value="{{ entry.showConnector }}" hint-placeholder-val="{{ true }}">
                    <div style="width:2px;flex:1;min-height:18px;background:rgba(103,0,53,0.12);margin-top:4px;"></div>
                  </sc-if>
                </div>
                <div style="flex:1;min-width:0;padding-bottom:16px;">
                  <p style="margin:0 0 3px 0;font-size:14px;line-height:20px;color:#670035;">{{ entry.text }}</p>
                  <span style="font-size:12px;color:rgba(103,0,53,0.5);">{{ entry.time }}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <button style="background:transparent;border:none;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;cursor:pointer;margin-top:4px;">
      <span style="font-size:13px;color:rgba(103,0,53,0.6);text-decoration:underline;text-decoration-color:rgba(103,0,53,0.25);">See your full timeline</span>
    </button>
  </sc-if>

  <sc-if value="{{ showEmptyState }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 20px 0 20px;">
      <image-slot id="recent-activity-empty-illo" shape="rounded" radius="20" style="width:160px;height:160px;" placeholder="Illustration, open notebook or blank page"></image-slot>
      <p style="margin:0;text-align:center;font-size:14px;line-height:21px;color:rgba(103,0,53,0.75);max-width:220px;">Nothing logged yet. It'll show up here as you go.</p>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812},&quot;hasActivity&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  entryBase(chipBg) {
    return {
      iconWrapStyle: {
        width: '34px', height: '34px', flexShrink: 0, borderRadius: '50%',
        background: chipBg, display: 'flex', alignItems: 'center', justifyContent: 'center',
      },
    };
  }

  renderVals() {
    const hasActivity = this.props.hasActivity ?? true;

    const mkEntry = (kind, text, time) => {
      const chipBgs = {
        moodGood: 'rgba(255,109,87,0.18)', moodNew: 'rgba(255,109,87,0.18)', moodWorried: 'rgba(255,109,87,0.18)',
        medicine: 'rgba(103,0,53,0.08)',
        wellness: 'rgba(157,221,161,0.32)',
        milestone: 'rgba(255,197,61,0.32)',
        appointment: 'rgba(103,0,53,0.08)',
      };
      const iconColors = {
        moodGood: '#D63A29', moodNew: '#D63A29', moodWorried: '#D63A29',
        medicine: '#670035', wellness: '#3B723F', milestone: '#670035', appointment: '#670035',
      };
      return {
        ...this.entryBase(chipBgs[kind]),
        iconColor: iconColors[kind],
        isMoodGood: kind === 'moodGood',
        isMoodNew: kind === 'moodNew',
        isMoodWorried: kind === 'moodWorried',
        isMedicine: kind === 'medicine',
        isWellness: kind === 'wellness',
        isMilestone: kind === 'milestone',
        isAppointment: kind === 'appointment',
        text, time,
      };
    };

    const groups = [
      {
        label: 'Today',
        entries: [
          mkEntry('moodGood', "Said you were feeling good", '2 hours ago'),
          mkEntry('medicine', "Took your iron tablet", 'This morning'),
        ],
      },
      {
        label: 'Yesterday',
        entries: [
          mkEntry('wellness', "Went for your evening walk", '7:00 PM'),
          mkEntry('moodNew', "Said something felt new", '10:30 AM'),
        ],
      },
      {
        label: 'This week',
        entries: [
          mkEntry('milestone', "Reached week 24", '3 days ago'),
          mkEntry('appointment', "Added a question for your checkup", '5 days ago'),
        ],
      },
    ];

    groups.forEach((g) => {
      g.entries.forEach((e, i) => { e.showConnector = i < g.entries.length - 1; });
    });

    return {
      hasActivity,
      showEmptyState: !hasActivity,
      groups,
    };
  }
}

</script>
</body>
</html>
