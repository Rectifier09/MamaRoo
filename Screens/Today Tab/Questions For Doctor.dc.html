<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>body{margin:0;background:#F7EEE3;}</style>
</helmet>

<div style="position:relative;width:375px;min-height:812px;margin:0 auto;background:#F7EEE3;font-family:'Roboto',sans-serif;box-sizing:border-box;padding:20px 20px 40px 20px;display:flex;flex-direction:column;gap:18px;">

  <div style="display:flex;align-items:center;gap:12px;">
    <button aria-label="Back" style="width:36px;height:36px;flex-shrink:0;border:none;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 8px rgba(103,0,53,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#670035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span style="font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:rgba(103,0,53,0.5);">Questions for my doctor</span>
  </div>

  <div>
    <h1 style="margin:0 0 6px 0;font-family:'Poppins',sans-serif;font-weight:600;font-size:21px;line-height:29px;color:#670035;">Getting ready for your checkup</h1>
    <p style="margin:0;font-size:13px;color:rgba(103,0,53,0.6);">Your 24 week appointment, this Thursday</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <sc-for list="{{ questions }}" as="q" hint-placeholder-count="3">
      <div style="{{ q.cardStyle }}">
        <button aria-label="{{ q.answerLabel }}" onClick="{{ q.toggleAnswered }}" style="{{ q.toggleStyle }}">
          <sc-if value="{{ q.answered }}" hint-placeholder-val="{{ false }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3B723F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </sc-if>
        </button>
        <p style="{{ q.textStyle }}">{{ q.text }}</p>
        <button aria-label="Remove this question" onClick="{{ q.remove }}" style="width:24px;height:24px;flex-shrink:0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(103,0,53,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(103,0,53,0.06);">
    <input type="text" placeholder="Add your own question" value="{{ draftText }}" onInput="{{ onDraftChange }}" style="flex:1;border:none;background:transparent;outline:none;font-family:'Roboto',sans-serif;font-size:14px;color:#670035;"/>
    <button aria-label="Add question by voice" style="width:32px;height:32px;flex-shrink:0;border:none;border-radius:50%;background:rgba(157,221,161,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3B723F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <button aria-label="Add question" onClick="{{ addQuestion }}" style="width:32px;height:32px;flex-shrink:0;border:none;border-radius:50%;background:#D63A29;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812}}">
class Component extends DCLogic {
  state = {
    draftText: '',
    questions: [
      { id: 1, text: "Is the way my baby is moving normal for this week", answered: false },
      { id: 2, text: "What can I do about the back pain I mentioned last time", answered: false },
      { id: 3, text: "Is it fine to keep taking my iron tablet along with my vitamin", answered: true },
    ],
    nextId: 4,
  };

  cardStyle(answered) {
    return {
      display: 'flex', alignItems: 'flex-start', gap: '10px',
      background: '#FFFFFF', borderRadius: '16px', padding: '14px',
      boxShadow: '0 3px 10px rgba(103,0,53,0.06)',
    };
  }

  toggleStyle(answered) {
    return {
      width: '22px', height: '22px', flexShrink: 0, marginTop: '1px', border: 'none', cursor: 'pointer',
      borderRadius: '50%', background: answered ? 'rgba(157,221,161,0.4)' : 'rgba(103,0,53,0.08)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    };
  }

  renderVals() {
    const questions = this.state.questions.map((q) => ({
      ...q,
      cardStyle: this.cardStyle(q.answered),
      toggleStyle: this.toggleStyle(q.answered),
      answerLabel: q.answered ? 'Mark as not answered yet' : 'Mark as answered',
      textStyle: {
        flex: '1', minWidth: 0, margin: 0, fontSize: '14px', lineHeight: '20px',
        color: q.answered ? 'rgba(103,0,53,0.5)' : '#670035',
        textDecoration: q.answered ? 'line-through' : 'none',
      },
      toggleAnswered: () => this.setState((s) => ({
        questions: s.questions.map((x) => x.id === q.id ? { ...x, answered: !x.answered } : x),
      })),
      remove: () => this.setState((s) => ({
        questions: s.questions.filter((x) => x.id !== q.id),
      })),
    }));

    return {
      questions,
      draftText: this.state.draftText,
      onDraftChange: (e) => this.setState({ draftText: e.target.value }),
      addQuestion: () => {
        const text = this.state.draftText.trim();
        if (!text) return;
        this.setState((s) => ({
          questions: [...s.questions, { id: s.nextId, text, answered: false }],
          nextId: s.nextId + 1,
          draftText: '',
        }));
      },
    };
  }
}

</script>
</body>
</html>
